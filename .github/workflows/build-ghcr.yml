name: Build and push image to GHCR

# Fork-only pipeline: builds the frontend and the linux/amd64 binary the way the
# Makefile/Dockerfile expect them, then pushes ghcr.io/<owner>/falcosidekick-ui
# tagged with the full commit SHA and `latest`.
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/swiru95/falcosidekick-ui

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GITHUB_TOKEN can push to this repository's own GHCR package.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend (frontend/dist)
        run: make frontend

      - name: Build linux/amd64 binary
        run: |
          mkdir -p linux/amd64
          make GOOS=linux GOARCH=amd64 falcosidekick-ui-backend-only
          mv falcosidekick-ui linux/amd64/falcosidekick-ui
        env:
          CGO_ENABLED: '0'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            TARGETOS=linux
            TARGETARCH=amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Summary
        run: |
          echo "### falcosidekick-ui" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
